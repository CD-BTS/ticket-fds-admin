spring.application.name=fairticket

# MySQL Database Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# DB의 datetime은 모두 UTC다(#47). 세션 시간대를 UTC로 고정해 DEFAULT (now()) 값도 UTC로 채운다.
# DB_URL의 serverTimezone/connectionTimeZone 값과 관계없이 적용된다.
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

# JPA / Hibernate Setting
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# LocalDateTime(UTC 값)을 Timestamp로 바꾸지 않고 JDBC에 그대로 넘긴다(#47).
# 없으면 JVM 시간대와 DB_URL의 serverTimezone이 다를 때 저장·조회 시각이 그 차이만큼 밀린다.
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true

# 관람 이력 NO_SHOW 판정(#56). 공연 종료 시각 + 유예 시간이 지난 미입장(BOOKED) 티켓만 판정한다.
# CHECK_IN은 비동기로 전송·재시도되므로 유예 시간을 0으로 두지 않는다.
bts.no-show.enabled=${NO_SHOW_ENABLED:true}
bts.no-show.grace=${NO_SHOW_GRACE:PT1H}
bts.no-show.check-interval-ms=${NO_SHOW_CHECK_INTERVAL_MS:60000}